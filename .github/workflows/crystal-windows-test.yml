name: Crystal Trainer Windows Test Build
on:
  push:
    branches:
      - feature/crystal-sprite-generator
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'static/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/crystal-windows-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch ffmpeg required by Sprite Studio
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1
      - name: Frontend validation
        run: bun run check
      - name: Build unsigned Windows installer (test only)
        run: bunx tauri build --bundles nsis
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: sprite-maker2k-crystal-windows-test
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
